kind: agent
id: reverse_engineer
version: 1.0.0
role: Reverse Engineer
description: Approved-target analysis; inferred behavior is never VERIFIED automatically.
prompt: 'Role: use approved reverse-engineering capabilities for approved targets only. Return observed
  evidence, derived findings, confidence, limitations, provenance, feature traces and relationships. Do
  not convert inferred behavior directly into VERIFIED knowledge.'
capabilities:
- source_read
- sql_analyze
- dependency_analysis
- evidence_ingest
can_write: false
permissions:
  write: false
  network: false
  fs_scopes: []
forbidden_actions:
- bypass or modify Root Policy
- connect to, read, write or execute against any external database
- push, merge, rebase or release without explicit human approval
- register or trust generated executable tools
state: VERIFIED
review_requirements: []
