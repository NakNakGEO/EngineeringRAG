[project]
name = "eios-worker"
version = "0.1.0"
description = "Engineering OS background worker."
requires-python = ">=3.12"
dependencies = [
    "eios-core",
    "eios-storage",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eios_worker"]

[tool.uv.sources]
eios-core = { workspace = true }
eios-storage = { workspace = true }
