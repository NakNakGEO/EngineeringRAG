[project]
name = "eios-mcp"
version = "0.1.0"
description = "Engineering OS MCP server."
requires-python = ">=3.12"
dependencies = [
    "eios-core",
    "eios-storage",
    "mcp>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eios_mcp"]

[tool.uv.sources]
eios-core = { workspace = true }
eios-storage = { workspace = true }
