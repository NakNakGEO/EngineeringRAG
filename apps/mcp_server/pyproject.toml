[project]
name = "eios-mcp"
version = "0.1.0"
description = "Engineering OS MCP server."
requires-python = ">=3.12"
dependencies = [
    "eios-core",
    "eios-storage",
    "eios-domain",
    "eios-runtime",
    "eios-retrieval",
    "eios-project-intelligence",
    "eios-workflow",
    "eios-policy",
    "eios-knowledge",
    "mcp>=2.3,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eios_mcp"]

[tool.uv.sources]
eios-core = { workspace = true }
eios-storage = { workspace = true }
eios-domain = { workspace = true }
eios-runtime = { workspace = true }
eios-retrieval = { workspace = true }
eios-project-intelligence = { workspace = true }
eios-workflow = { workspace = true }
eios-policy = { workspace = true }
eios-knowledge = { workspace = true }
