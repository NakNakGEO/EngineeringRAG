[project]
name = "eios-api"
version = "0.1.0"
description = "Engineering OS HTTP API."
requires-python = ">=3.12"
dependencies = [
    "eios-core",
    "eios-storage",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eios_api"]

[tool.uv.sources]
eios-core = { workspace = true }
eios-storage = { workspace = true }
