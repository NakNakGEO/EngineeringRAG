name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: eios
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: eios
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eios -d eios"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      EIOS_REQUIRE_DB_TESTS: "1"
      EIOS_TEST_DATABASE_URL: postgresql+psycopg://eios:ci-only-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python scripts/check_forbidden_deps.py
      - run: uv run pytest

  compose-boot:
    runs-on: ubuntu-latest
    env:
      EIOS_POSTGRES_USER: eios
      EIOS_POSTGRES_PASSWORD: ci-only-password
      EIOS_POSTGRES_DB: eios
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - run: curl --fail http://127.0.0.1:8000/health/ready
      - run: curl --fail http://127.0.0.1:8082/health/ready
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
