[project]
name = "eios-retrieval"
version = "0.1.0"
description = "Adaptive multi-stage retrieval, Context Governor and Impact Analyzer."
requires-python = ">=3.12"
dependencies = [
    "eios-core",
    "eios-domain",
    "eios-storage",
    "eios-observability",
    "eios-knowledge",
    "eios-project-intelligence",
    "sqlalchemy[asyncio]>=2.0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eios_retrieval"]

[tool.uv.sources]
eios-core = { workspace = true }
eios-domain = { workspace = true }
eios-storage = { workspace = true }
eios-observability = { workspace = true }
eios-knowledge = { workspace = true }
eios-project-intelligence = { workspace = true }
