[project]
name = "eios-workshop"
version = "0.1.0"
description = "Capability Gap Resolver and Capability Workshop (generated skills, agents and tools)."
requires-python = ">=3.12"
dependencies = [
    "eios-core",
    "eios-domain",
    "eios-storage",
    "eios-observability",
    "eios-capability",
    "eios-policy",
    "eios-governance",
    "eios-llm",
    "sqlalchemy[asyncio]>=2.0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eios_workshop"]

[tool.uv.sources]
eios-core = { workspace = true }
eios-domain = { workspace = true }
eios-storage = { workspace = true }
eios-observability = { workspace = true }
eios-capability = { workspace = true }
eios-policy = { workspace = true }
eios-governance = { workspace = true }
eios-llm = { workspace = true }
