[project]
name = "eios-runtime"
version = "0.1.0"
description = "Composition root: builds the service container shared by API, worker and MCP."
requires-python = ">=3.12"
dependencies = [
    "eios-core",
    "eios-domain",
    "eios-storage",
    "eios-observability",
    "eios-knowledge",
    "eios-jobs",
    "eios-project-intelligence",
    "sqlalchemy[asyncio]>=2.0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eios_runtime"]

[tool.uv.sources]
eios-core = { workspace = true }
eios-domain = { workspace = true }
eios-storage = { workspace = true }
eios-observability = { workspace = true }
eios-knowledge = { workspace = true }
eios-jobs = { workspace = true }
eios-project-intelligence = { workspace = true }
