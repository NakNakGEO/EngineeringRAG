[project]
name = "eios-llm"
version = "0.1.0"
description = "Vendor-neutral LLM gateway: provider protocol, HTTP adapters, budgets and observability."
requires-python = ">=3.12"
dependencies = [
    "eios-core",
    "eios-domain",
    "eios-observability",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eios_llm"]

[tool.uv.sources]
eios-core = { workspace = true }
eios-domain = { workspace = true }
eios-observability = { workspace = true }
