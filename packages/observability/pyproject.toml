[project]
name = "eios-observability"
version = "0.1.0"
description = "Run recording, append-only event store, live event streaming."
requires-python = ">=3.12"
dependencies = [
    "eios-core",
    "eios-domain",
    "eios-storage",
    "sqlalchemy[asyncio]>=2.0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eios_observability"]

[tool.uv.sources]
eios-core = { workspace = true }
eios-domain = { workspace = true }
eios-storage = { workspace = true }
