[project]
name = "eios-project-intelligence"
version = "0.1.0"
description = "Project identity, git state, file inventory, symbols, dependency graph and incremental indexing."
requires-python = ">=3.12"
dependencies = [
    "eios-core",
    "eios-domain",
    "eios-storage",
    "eios-observability",
    "eios-jobs",
    "eios-knowledge",
    "sqlalchemy[asyncio]>=2.0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eios_project_intelligence"]

[tool.uv.sources]
eios-core = { workspace = true }
eios-domain = { workspace = true }
eios-storage = { workspace = true }
eios-observability = { workspace = true }
eios-jobs = { workspace = true }
eios-knowledge = { workspace = true }
