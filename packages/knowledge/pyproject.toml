[project]
name = "eios-knowledge"
version = "0.1.0"
description = "Knowledge, evidence, memory and decision repositories; evidence pipeline; blob store; embeddings."
requires-python = ">=3.12"
dependencies = [
    "eios-core",
    "eios-domain",
    "eios-storage",
    "eios-observability",
    "sqlalchemy[asyncio]>=2.0.36",
    "pgvector>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eios_knowledge"]

[tool.uv.sources]
eios-core = { workspace = true }
eios-domain = { workspace = true }
eios-storage = { workspace = true }
eios-observability = { workspace = true }
