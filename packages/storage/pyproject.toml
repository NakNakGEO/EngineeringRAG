[project]
name = "eios-storage"
version = "0.1.0"
description = "Engineering OS PostgreSQL access (engine, health, migrations support)."
requires-python = ">=3.12"
dependencies = [
    "eios-core",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eios_storage"]

[tool.uv.sources]
eios-core = { workspace = true }
