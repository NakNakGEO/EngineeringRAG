[project]
name = "eios-jobs"
version = "0.1.0"
description = "PostgreSQL-backed job queue with leases, plus a job runner."
requires-python = ">=3.12"
dependencies = [
    "eios-core",
    "eios-domain",
    "eios-storage",
    "eios-observability",
    "sqlalchemy[asyncio]>=2.0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eios_jobs"]

[tool.uv.sources]
eios-core = { workspace = true }
eios-domain = { workspace = true }
eios-storage = { workspace = true }
eios-observability = { workspace = true }
