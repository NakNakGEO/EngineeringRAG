[project]
name = "eios-governance"
version = "0.1.0"
description = "Knowledge governance: trust/health lifecycle, invalidation, contradictions, supersession, decisions, evaluation and maintenance."
requires-python = ">=3.12"
dependencies = [
    "eios-core",
    "eios-domain",
    "eios-storage",
    "eios-observability",
    "eios-knowledge",
    "eios-capability",
    "eios-project-intelligence",
    "sqlalchemy[asyncio]>=2.0.36",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eios_governance"]

[tool.uv.sources]
eios-core = { workspace = true }
eios-domain = { workspace = true }
eios-storage = { workspace = true }
eios-observability = { workspace = true }
eios-knowledge = { workspace = true }
eios-capability = { workspace = true }
eios-project-intelligence = { workspace = true }
