[project]
name = "eios-domain"
version = "0.1.0"
description = "Pure domain models: ids, runs, events, budgets, policy decisions (no I/O)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eios_domain"]
