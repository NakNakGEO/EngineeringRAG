# Anything but the loopback names is refused: a web page that makes its own domain resolve to
# 127.0.0.1 (DNS rebinding) must not be able to talk to the API through this proxy.
server {
  listen 8080 default_server;
  server_name _;
  return 421;
}

server {
  listen 8080;
  server_name localhost 127.0.0.1;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

  location /api/ {
    # Re-resolve the api container's address (Docker's DNS) so restarting or rebuilding the API
    # does not leave nginx pointing at a dead IP (502 until nginx itself restarts).
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream http://api:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;          # server-sent events
    proxy_read_timeout 3700s;
  }
  # The page itself is never cached, so a new build is picked up on the next load; the hashed
  # files under /assets/ never change and can be cached for good. (add_header in a location
  # replaces the server-level ones, so the security headers are repeated.)
  location = /index.html {
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }
  location / { try_files $uri /index.html; }
}
