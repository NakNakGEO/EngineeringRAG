# Alembic configuration for the Engineering OS PostgreSQL ONLY.
# The database URL is NOT configured here: migrations/env.py reads EIOS_DATABASE_URL through
# eios_core.Settings, which enforces the external-database policy. Never add a URL to this file.
[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
timezone = UTC
version_locations = migrations/versions
