[project]
name = "engineering-intelligence-os"
version = "0.1.0"
description = "Local-first, model-agnostic Engineering Intelligence OS (workspace root)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "eios-runtime",
    "eios-project-intelligence",
    "eios-jobs",
    "eios-portability",
    "eios-knowledge",
    "eios-observability",
    "eios-domain",
    "eios-core",
    "eios-storage",
    "eios-api",
    "eios-worker",
    "eios-mcp",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
eios-runtime = { workspace = true }
eios-project-intelligence = { workspace = true }
eios-jobs = { workspace = true }
eios-portability = { workspace = true }
eios-knowledge = { workspace = true }
eios-observability = { workspace = true }
eios-domain = { workspace = true }
eios-core = { workspace = true }
eios-storage = { workspace = true }
eios-api = { workspace = true }
eios-worker = { workspace = true }
eios-mcp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

# --------------------------------------------------------------------------
# Tooling
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "N", "C4", "PT"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["eios_runtime", "eios_project_intelligence", "eios_jobs", "eios_portability", "eios_knowledge", "eios_observability", "eios_domain", "eios_core", "eios_storage", "eios_api", "eios_worker", "eios_mcp"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PT018", "ASYNC240", "ASYNC230"]
"scripts/**" = ["S101"]
"packages/project_intelligence/src/eios_project_intelligence/parsers/brace_parsers.py" = ["E501"]  # regexes

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages", "apps", "tests", "migrations", "scripts"]
explicit_package_bases = true
mypy_path = [
    "packages/runtime/src",
    "packages/project_intelligence/src",
    "packages/jobs/src",
    "packages/portability/src",
    "packages/knowledge/src",
    "packages/observability/src",
    "packages/domain/src",
    "packages/core/src",
    "packages/storage/src",
    "apps/api/src",
    "apps/worker/src",
    "apps/mcp_server/src",
    "scripts",
]
exclude = ["migrations/versions/"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs the Engineering OS PostgreSQL server (see docs/development.md)",
    "security: guards a Root Policy / architecture invariant",
]
addopts = "-ra --strict-markers"
